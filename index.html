<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="todo-app">

            <div class="heading">
                <div>
                    <p class="small-title">MY DAILY PLANNER</p>
                    <h1>My Tasks <span>✓</span></h1>
                    <p class="subtitle">Stay organized. Get things done.</p>
                </div>
            </div>

            <div class="task-input">
                <input type="text" id="input-box" placeholder="What needs to be done?">
                <button onclick="addTask()">Add</button>
            </div>

            <div class="task-info">
                <p id="task-count">0 tasks</p>
                <p>Click a task to complete it</p>
            </div>

            <ul id="list-container"></ul>

            

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
